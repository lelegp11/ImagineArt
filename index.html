<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo Personalizados</title>

<style>
:root{
  --bg:#f5f1eb;
  --card:#ffffff;
  --text:#2c211c;
  --muted:#7a6a63;
  --line:#eadfd6;
  --primary:#a06b4f;
  --primary-2:#d9b7a4;
  --shadow:0 10px 30px rgba(73,45,28,.08);
  --radius:18px;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:linear-gradient(180deg,#f7f3ee 0%,#f1e9e2 100%);
  color:var(--text);
}

.container{
  max-width:1200px;
  margin:auto;
  padding:24px;
}

h1{
  text-align:center;
  color:var(--primary);
  font-size:32px;
}

.catalog-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:20px;
  margin-top:20px;
}

.card{
  background:var(--card);
  border-radius:20px;
  box-shadow:var(--shadow);
  padding:18px;
  border:1px solid var(--line);
  transition:.2s;
}

.card:hover{
  transform:translateY(-3px);
}

.price{
  font-size:24px;
  font-weight:bold;
  color:var(--primary);
  margin-top:6px;
}

.input, textarea{
  width:100%;
  padding:12px;
  border-radius:12px;
  border:1px solid var(--line);
  margin-top:8px;
  background:#fff;
}

.btn{
  background:var(--primary);
  color:#fff;
  border:none;
  padding:12px;
  border-radius:12px;
  cursor:pointer;
  font-weight:700;
  width:100%;
  margin-top:10px;
}

.btn:hover{
  background:#8a563e;
}

.checkout{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#fff;
  border-top:1px solid var(--line);
  padding:16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  box-shadow:0 -10px 20px rgba(0,0,0,.05);
}

.total{
  font-size:18px;
  font-weight:bold;
}

</style>
</head>

<body>

<div class="container">

<h1>Catálogo Personalizados</h1>

<div class="catalog-grid" id="produtos"></div>

<h2 style="margin-top:30px;">Seus dados</h2>

<input class="input" id="nome" placeholder="Seu nome">
<input class="input" id="telefone" placeholder="Seu WhatsApp">
<textarea class="input" id="obs" placeholder="Detalhes do pedido"></textarea>

</div>

<div class="checkout">
  <div class="total" id="total">R$ 0,00</div>
  <button class="btn" onclick="enviarPedido()">Enviar Pedido</button>
</div>

<script>

let produtos = [
  {nome:"Caneca Personalizada", preco:40},
  {nome:"Squeeze Personalizado", preco:60},
  {nome:"Camiseta Personalizada", preco:80}
];

let carrinho = [];

function render(){
  let html = "";
  produtos.forEach((p,i)=>{
    html += `
      <div class="card">
        <strong>${p.nome}</strong>
        <div class="price">R$ ${p.preco}</div>
        <input class="input" placeholder="Personalização" id="pers${i}">
        <button class="btn" onclick="add(${i})">Adicionar</button>
      </div>
    `;
  });
  document.getElementById("produtos").innerHTML = html;
}

function add(i){
  let pers = document.getElementById("pers"+i).value;
  carrinho.push({...produtos[i], pers});
  atualizar();
}

function atualizar(){
  let total = carrinho.reduce((a,b)=>a+b.preco,0);
  document.getElementById("total").innerText = 
    total.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
}

function enviarPedido(){
  let nome = document.getElementById("nome").value;
  let telefone = document.getElementById("telefone").value;

  let msg = "Pedido:%0A";
  
  carrinho.forEach(p=>{
    msg += `${p.nome} - ${p.pers}%0A`;
  });

  msg += `%0ANome: ${nome}%0ATel: ${telefone}`;

  window.open(`https://wa.me/SEUNUMERO?text=${msg}`);
}

render();

</script>

</body>
</html>
