<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo</title>

<style>
:root{
  --bg:#f5f1eb;
  --card:#ffffff;
  --text:#2c211c;
  --muted:#7a6a63;
  --line:#eadfd6;
  --primary:#a06b4f;
  --primary-2:#d9b7a4;
  --shadow:0 10px 30px rgba(73,45,28,.08);
}
body{
  margin:0;
  font-family:sans-serif;
  background:var(--bg);
}

.container{
  padding:20px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:20px;
}

.card{
  background:#fff;
  padding:15px;
  border-radius:20px;
  box-shadow:var(--shadow);
}

.price{
  color:var(--primary);
  font-weight:bold;
  font-size:20px;
}

.btn{
  background:var(--primary);
  color:#fff;
  border:none;
  padding:10px;
  border-radius:10px;
  cursor:pointer;
  margin-top:10px;
}

.checkout{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#fff;
  padding:15px;
  border-top:1px solid var(--line);
  display:flex;
  justify-content:space-between;
}

input{
  width:100%;
  padding:10px;
  margin-top:10px;
  border-radius:10px;
  border:1px solid var(--line);
}

</style>
</head>

<body>

<div class="container">

<h1>Catálogo</h1>

<div class="grid" id="produtos"></div>

<h2>Seus dados</h2>
<input id="nome" placeholder="Seu nome">
<input id="tel" placeholder="WhatsApp">

</div>

<div class="checkout">
  <div id="total">R$ 0</div>
  <button class="btn" onclick="enviar()">Enviar Pedido</button>
</div>

<script>

let produtos = JSON.parse(localStorage.getItem("produtos")||"[]");
let carrinho=[];

function render(){
  let html="";
  produtos.forEach((p,i)=>{
    html+=`
      <div class="card">
        <strong>${p.nome}</strong>
        <div class="price">R$ ${p.preco}</div>
        <button class="btn" onclick="add(${i})">Adicionar</button>
      </div>
    `;
  });
  document.getElementById("produtos").innerHTML=html;
}

function add(i){
  carrinho.push(produtos[i]);
  atualizar();
}

function atualizar(){
  let total = carrinho.reduce((a,b)=>a+Number(b.preco),0);
  document.getElementById("total").innerText="R$ "+total;
}

function enviar(){
  let nome=document.getElementById("nome").value;
  let msg="Pedido:%0A";

  carrinho.forEach(p=>{
    msg+=p.nome+"%0A";
  });

  msg+="Nome:"+nome;

  window.open("https://wa.me/SEUNUMERO?text="+msg);
}

render();

</script>

</body>
</html>
