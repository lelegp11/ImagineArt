<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Personaliza Hub</title>

<style>
:root{
  --bg:#f5f1eb;
  --card:#ffffff;
  --text:#2c211c;
  --muted:#7a6a63;
  --line:#eadfd6;
  --primary:#a06b4f;
  --primary-2:#d9b7a4;
  --accent:#c89b84;
  --shadow:0 10px 30px rgba(73,45,28,.08);
}
body{
  margin:0;
  font-family:sans-serif;
  background:var(--bg);
}

.topbar{
  background:#fff;
  padding:15px;
  border-bottom:1px solid var(--line);
}

.container{
  padding:20px;
}

.card{
  background:#fff;
  padding:20px;
  border-radius:20px;
  box-shadow:var(--shadow);
  margin-bottom:20px;
}

.btn{
  background:var(--primary);
  color:#fff;
  border:none;
  padding:10px 15px;
  border-radius:10px;
  cursor:pointer;
}

input{
  width:100%;
  padding:10px;
  margin-top:10px;
  border:1px solid var(--line);
  border-radius:10px;
}

</style>
</head>

<body>

<div class="topbar">
  <strong>Painel Administrativo</strong>
</div>

<div class="container">

<div class="card">
  <h2>Cadastro de Produto</h2>
  <input id="nome" placeholder="Nome do produto">
  <input id="preco" placeholder="Preço">
  <button class="btn" onclick="add()">Salvar</button>
</div>

<div class="card">
  <h2>Produtos</h2>
  <div id="lista"></div>
</div>

</div>

<script>
let produtos = JSON.parse(localStorage.getItem("produtos")||"[]");

function salvar(){
  localStorage.setItem("produtos",JSON.stringify(produtos));
}

function add(){
  let nome = document.getElementById("nome").value;
  let preco = document.getElementById("preco").value;

  produtos.push({nome,preco});
  salvar();
  render();
}

function render(){
  let html="";
  produtos.forEach(p=>{
    html+=`<div>${p.nome} - R$ ${p.preco}</div>`;
  });
  document.getElementById("lista").innerHTML = html;
}

render();
</script>

</body>
</html>
